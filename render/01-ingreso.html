<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso · Ítaca Finanzas (render)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8B6A45}a:hover{color:#3A3127}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EEE4; color: #3A3127; font-family: Jost, sans-serif; padding: 96px 32px 40px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<img src="logo.png" alt="Logo Ítaca" style="width: 120px; height: 58px; object-fit: contain">
<div style="font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 500; letter-spacing: .14em; line-height: 1">ÍTACA</div>
<div style="font-size: 11px; letter-spacing: .34em; color: #6B5F51">FINANZAS</div>
<div style="width: 40px; height: 1px; background: #8B6A45; margin-top: 8px"></div>
<div style="font-family: 'Cormorant Garamond', serif; font-size: 22px; font-style: italic; color: #6B5F51; margin-top: 10px">Hola, Tere</div>
</div>
<form style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: .18em; color: #6B5F51">CORREO
<input type="email" value="teresita@correo.cl" style="height: 52px; border-radius: 12px; border: 1px solid #DCD1C0; background: #FBF8F3; padding: 0 16px; font: 16px Jost, sans-serif; color: #3A3127; letter-spacing: 0">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: .18em; color: #6B5F51">CONTRASEÑA
<input type="password" value="contrasena" style="height: 52px; border-radius: 12px; border: 1px solid #DCD1C0; background: #FBF8F3; padding: 0 16px; font: 16px Jost, sans-serif; color: #3A3127; letter-spacing: 0">
</label>
<button type="button" style="height: 54px; border: 0; border-radius: 12px; background: #3A3127; color: #F4EEE4; font: 500 15px Jost, sans-serif; letter-spacing: .2em; margin-top: 8px">INGRESAR</button>
<a href="#" style="align-self: center; font-size: 14px; padding: 12px">¿Olvidaste tu contraseña?</a>
</form>
<div style="text-align: center; font-size: 11px; letter-spacing: .28em; color: #6B5F51">JOYAS CON HISTORIA</div>
</div>
</body>
</html>
